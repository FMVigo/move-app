<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Move">
<meta name="theme-color" content="#16130f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Move daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/*
VOICE   warm, upbeat coach, few words, big numbers
IDEA    a training card pinned on the gym wall, readable from two metres
PICTURE the animated coach beside your live camera
COLOUR  deep warm charcoal, sand figure, coral energy accent
TYPE    Barlow Condensed for numbers and titles, Barlow for text
*/
:root{--bg:#16130f;--bg2:#211d18;--bg3:#2c2721;--ink:#f6efe6;--mute:#b4a898;--acc:#ff5a36;--ok:#7fd18b;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:calc(var(--safe-t) + 14px) 18px calc(var(--safe-b) + 14px)}
.screen.on{display:flex}
h1,h2,.num{font-family:'Barlow Condensed',Barlow,sans-serif;font-weight:800;line-height:1.02;margin:0;letter-spacing:.2px}

/* Home */
#home{overflow-y:auto}
.hello{font-size:clamp(34px,9vw,48px);text-wrap:balance}
.hello span{color:var(--acc)}
.quote{color:var(--mute);margin:6px 0 18px;font-size:17px}
.streak{display:flex;gap:10px;margin-bottom:18px}
.stat{flex:1;background:var(--bg2);border-radius:18px;padding:12px 14px}
.stat .num{font-size:38px}
.stat small{display:block;color:var(--mute);font-size:13px}
.week{display:flex;gap:5px;margin-top:8px}
.week i{flex:1;height:8px;border-radius:4px;background:var(--bg3)}
.week i.d{background:var(--acc)}
.card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--bg2);border-radius:22px;padding:16px;margin-bottom:12px;min-height:96px;position:relative}
.card:active{transform:scale(.985)}
.card canvas{width:70px;height:90px;flex:none}
.card h2{font-size:27px}
.card p{margin:2px 0 0;color:var(--mute);font-size:14px}
.card .meta{font-family:'Barlow Condensed',Barlow,system-ui,sans-serif;font-weight:600;color:var(--acc);font-size:16px;letter-spacing:.3px}
.card .tick{position:absolute;top:14px;right:16px;width:30px;height:30px;border-radius:50%;border:2px solid var(--bg3);display:grid;place-items:center;font-weight:700}
.card.done .tick{background:var(--ok);border-color:var(--ok);color:#10220f}
.settings{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{background:var(--bg2);border-radius:999px;padding:10px 16px;min-height:44px;font-size:15px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.src{margin-top:18px;color:var(--mute);font-size:13px}
.src a{color:var(--mute)}

/* Player */
#player{padding-left:12px;padding-right:12px}
.top{display:flex;align-items:flex-start;gap:10px}
.top .ttl{flex:1}
.phase{font-family:'Barlow Condensed',Barlow,system-ui,sans-serif;font-weight:600;color:var(--acc);font-size:17px;letter-spacing:.4px}
.exname{font-size:clamp(30px,8.5vw,46px);text-wrap:balance}
.x{width:44px;height:44px;border-radius:50%;background:var(--bg2);font-size:22px;flex:none}
.stage{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:10px 0;min-height:0}
.stage.nocam{grid-template-columns:minmax(0,1fr)}
.panel{position:relative;background:var(--bg2);border-radius:22px;overflow:hidden;min-height:0}
.panel canvas.fig{position:absolute;inset:0;width:100%;height:100%}
.panel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.panel canvas.ov{position:absolute;inset:0;width:100%;height:100%}
.tag{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.45);padding:3px 10px;border-radius:999px;font-size:13px;z-index:2}
.reps{position:absolute;bottom:10px;right:12px;font-family:'Barlow Condensed',Barlow,system-ui,sans-serif;font-weight:800;font-size:54px;line-height:1;z-index:2;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.reps small{display:block;font-size:14px;font-weight:600;text-align:right;color:var(--ink)}
.hint{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(22,19,15,.85);border-radius:14px;padding:8px 10px;font-size:14px;z-index:3;display:none}
.camoff{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;color:var(--mute);font-size:15px}
.bottom{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.clock{position:relative;width:118px;height:118px}
.clock svg{width:100%;height:100%;transform:rotate(-90deg)}
.clock .num{position:absolute;inset:0;display:grid;place-items:center;font-size:52px}
.cue{font-size:19px;line-height:1.3;font-weight:500;min-height:3.9em}
.next{color:var(--mute);font-size:14px;margin-top:4px}
.ctrls{display:flex;gap:10px;margin-top:12px}
.ctrls button{flex:1;min-height:56px;border-radius:18px;background:var(--bg2);font-weight:600;font-size:17px}
.ctrls .main{background:var(--acc);color:#fff;flex:1.4}
.progress{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--acc);width:0}
.overlay{position:absolute;inset:0;background:rgba(22,19,15,.72);display:none;place-items:center;text-align:center;z-index:5}
.overlay.on{display:grid}
.overlay .num{font-size:120px;color:var(--acc)}

/* Done */
#done{justify-content:center;align-items:center;text-align:center;gap:10px}
#done h1{font-size:56px}
#done p{color:var(--mute);font-size:18px;max-width:22em;margin:0}
#done .big{font-size:84px;color:var(--acc)}
#done button{margin-top:18px;background:var(--acc);color:#fff;border-radius:18px;min-height:56px;padding:0 34px;font-weight:600;font-size:18px}

@media (orientation:landscape) and (max-height:600px){
  .exname{font-size:30px}.clock{width:84px;height:84px}.clock .num{font-size:38px}.cue{min-height:0;font-size:16px}
  #player{display:none}#player.on{display:grid;grid-template-columns:1.6fr 1fr;grid-template-rows:auto 1fr;column-gap:14px}
  #player .top{grid-column:1/3}#player .stage{grid-row:2;margin:6px 0 0}#player .side{grid-row:2;display:flex;flex-direction:column;justify-content:center}
}
@media (prefers-reduced-motion:reduce){.card:active{transform:none}}
</style>
</head>
<body>

<section id="home" class="screen on" aria-label="Home">
  <h1 class="hello" id="hello">Good morning, <span>Francisco</span></h1>
  <p class="quote" id="quote"></p>
  <div class="streak">
    <div class="stat"><div class="num" id="streakN">0</div><small>day streak</small><div class="week" id="week"></div></div>
    <div class="stat"><div class="num" id="todayN">0/3</div><small>sessions today</small><div class="week" id="todayBar"></div></div>
  </div>
  <div id="cards"></div>
  <div class="settings">
    <button class="chip" id="setVoice" aria-pressed="true">Voice coach</button>
    <button class="chip" id="setCam" aria-pressed="true">Camera</button>
    <button class="chip" id="setKb">Kettlebell 16 kg</button>
  </div>
  <p class="src">Moves inspired by your saved Gym posts: <span id="srcLinks"></span>. Stop any move that causes sharp pain.</p>
</section>

<section id="player" class="screen" aria-label="Workout">
  <div class="top">
    <div class="ttl"><div class="phase" id="phase">Get ready</div><h2 class="exname" id="exname">Heel bounces</h2></div>
    <button class="x" id="quit" aria-label="End session">×</button>
  </div>
  <div class="stage" id="stage">
    <div class="panel"><span class="tag">Coach</span><canvas class="fig" id="coach"></canvas>
      <div class="overlay" id="countdown"><div><div class="num" id="cdN">5</div><div id="cdT">Get ready</div></div></div>
    </div>
    <div class="panel" id="camPanel"><span class="tag">You</span>
      <video id="video" playsinline muted autoplay></video><canvas class="ov" id="overlay"></canvas>
      <div class="camoff" id="camMsg">Starting camera…</div>
      <div class="reps" id="reps">0<small>reps</small></div>
      <div class="hint" id="hint"></div>
    </div>
  </div>
  <div class="side">
    <div class="bottom">
      <div class="clock"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="53" fill="none" stroke="#2c2721" stroke-width="10"/><circle id="ring" cx="60" cy="60" r="53" fill="none" stroke="#ff5a36" stroke-width="10" stroke-linecap="round" stroke-dasharray="333" stroke-dashoffset="0"/></svg><div class="num" id="time">60</div></div>
      <div><div class="cue" id="cue"></div><div class="next" id="next"></div></div>
    </div>
    <div class="progress"><i id="prog"></i></div>
    <div class="ctrls">
      <button id="back" aria-label="Previous move">Back</button>
      <button class="main" id="pause">Pause</button>
      <button id="skip" aria-label="Next move">Skip</button>
    </div>
  </div>
</section>

<section id="done" class="screen" aria-label="Finished">
  <div class="big num" id="doneStreak">1</div>
  <h1 id="doneTitle">Session done</h1>
  <p id="doneText"></p>
  <button id="home2">Back home</button>
</section>

<script src="exercises.js"></script>
<script src="figure.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
